<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="headerGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700" letter-spacing="1">RELFOR INVENTORY &amp; DONATION ALLOCATION SYSTEM</text>
  <text x="800" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Entity Relationship Diagram (PostgreSQL Schema Architecture)</text>

  <!-- Connectors (drawn behind tables) -->
  <!-- donors -> donations -->
  <path d="M 330 180 L 450 180" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- resources -> donations -->
  <path d="M 600 520 L 600 375" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- users -> donations -->
  <path d="M 330 520 L 450 300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- organizations -> users -->
  <path d="M 200 440 L 200 490" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- organizations -> requests -->
  <path d="M 330 300 L 790 300 L 830 300" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- requests -> request_items -->
  <path d="M 975 440 L 975 510" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- resources -> request_items -->
  <path d="M 740 650 L 840 650" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- requests -> allocations -->
  <path d="M 1120 280 L 1220 280" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- allocations -> allocation_items -->
  <path d="M 1365 410 L 1365 510" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- request_items -> allocation_items -->
  <path d="M 1110 650 L 1230 650" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <!-- allocations -> distributions -->
  <path d="M 1365 170 L 1365 120 L 1150 120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- ================= TABLE: DONORS ================= -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="270" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#headerGrad1)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">donors</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12">name : varchar(200)</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12">type : varchar(50)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="12">email : varchar(255)</text>
    <text x="15" y="160" fill="#94a3b8" font-size="12">phone : varchar(50)</text>
    <text x="15" y="185" fill="#94a3b8" font-size="12">address : text</text>
    <text x="15" y="210" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: ORGANIZATIONS ================= -->
  <g transform="translate(60, 390)" filter="url(#shadow)">
    <rect width="270" height="290" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#headerGrad2)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">organizations</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12">name : varchar(200)</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12">type : varchar(50)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="12">registration_number</text>
    <text x="15" y="160" fill="#f8fafc" font-size="12">contact_person : varchar</text>
    <text x="15" y="185" fill="#f8fafc" font-size="12">phone : varchar(50)</text>
    <text x="15" y="210" fill="#f8fafc" font-size="12">email : varchar(255)</text>
    <text x="15" y="235" fill="#94a3b8" font-size="12">address : text</text>
    <text x="15" y="260" fill="#f8fafc" font-size="12">is_verified : boolean</text>
  </g>

  <!-- ================= TABLE: USERS ================= -->
  <g transform="translate(60, 730)" filter="url(#shadow)">
    <rect width="270" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 262 0 Q 270 0 270 8 L 270 38 L 0 38 Z" fill="url(#headerGrad4)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">users</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12">email : varchar(255) [UK]</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12">password_hash : varchar</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12">full_name : varchar(150)</text>
    <text x="15" y="160" fill="#f8fafc" font-size="12">role : varchar(20)</text>
    <text x="15" y="185" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">FK </tspan>organization_id : uuid</text>
    <text x="15" y="210" fill="#f8fafc" font-size="12">is_active : boolean</text>
    <text x="15" y="235" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: DONATIONS ================= -->
  <g transform="translate(450, 110)" filter="url(#shadow)">
    <rect width="290" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 282 0 Q 290 0 290 8 L 290 38 L 0 38 Z" fill="url(#headerGrad1)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">donations</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="600">FK </tspan>donor_id : uuid</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12"><tspan fill="#fbbf24" font-weight="600">FK </tspan>resource_id : uuid</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12">quantity : int (chk &gt; 0)</text>
    <text x="15" y="160" fill="#f8fafc" font-size="12">condition : varchar(30)</text>
    <text x="15" y="185" fill="#f8fafc" font-size="12">donation_date : timestamptz</text>
    <text x="15" y="210" fill="#94a3b8" font-size="12">expiry_date : date</text>
    <text x="15" y="235" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">FK </tspan>received_by_user_id : uuid</text>
    <text x="15" y="260" fill="#64748b" font-size="11">notes, created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: RESOURCES ================= -->
  <g transform="translate(450, 520)" filter="url(#shadow)">
    <rect width="290" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 282 0 Q 290 0 290 8 L 290 38 L 0 38 Z" fill="url(#headerGrad3)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">resources (inventory)</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#fbbf24" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12">name : varchar(150) [UK]</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12">category : varchar(50)</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12">unit : varchar(50)</text>
    <text x="15" y="160" fill="#94a3b8" font-size="12">description : text</text>
    <text x="15" y="185" fill="#f8fafc" font-size="12">minimum_stock : int (chk &gt;= 0)</text>
    <text x="15" y="210" fill="#4ade80" font-size="12" font-weight="600">current_stock : int (chk &gt;= 0)</text>
    <text x="15" y="235" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: REQUESTS ================= -->
  <g transform="translate(840, 180)" filter="url(#shadow)">
    <rect width="280" height="260" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#headerGrad2)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">requests</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">FK </tspan>organization_id : uuid</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">FK </tspan>requested_by_user_id : uuid</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12">priority : varchar(20)</text>
    <text x="15" y="160" fill="#38bdf8" font-size="12" font-weight="600">status : varchar(30)</text>
    <text x="15" y="185" fill="#94a3b8" font-size="12">notes : text</text>
    <text x="15" y="210" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: REQUEST_ITEMS ================= -->
  <g transform="translate(840, 520)" filter="url(#shadow)">
    <rect width="280" height="240" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#headerGrad2)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">request_items</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">FK </tspan>request_id : uuid</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12"><tspan fill="#fbbf24" font-weight="600">FK </tspan>resource_id : uuid</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12">requested_qty : int (chk &gt; 0)</text>
    <text x="15" y="160" fill="#f8fafc" font-size="12">allocated_qty : int (chk &gt;= 0)</text>
    <text x="15" y="185" fill="#cbd5e1" font-size="11">chk: allocated &lt;= requested</text>
    <text x="15" y="210" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: ALLOCATIONS ================= -->
  <g transform="translate(1230, 180)" filter="url(#shadow)">
    <rect width="280" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#headerGrad4)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">allocations</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">FK </tspan>request_id : uuid</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">FK </tspan>allocated_by_user_id : uuid</text>
    <text x="15" y="135" fill="#38bdf8" font-size="12" font-weight="600">status : varchar(30)</text>
    <text x="15" y="160" fill="#94a3b8" font-size="12">notes : text</text>
    <text x="15" y="185" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: ALLOCATION_ITEMS ================= -->
  <g transform="translate(1230, 520)" filter="url(#shadow)">
    <rect width="280" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 272 0 Q 280 0 280 8 L 280 38 L 0 38 Z" fill="url(#headerGrad4)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">allocation_items</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">FK </tspan>allocation_id : uuid</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12"><tspan fill="#34d399" font-weight="600">FK </tspan>request_item_id : uuid</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12"><tspan fill="#fbbf24" font-weight="600">FK </tspan>resource_id : uuid</text>
    <text x="15" y="160" fill="#f8fafc" font-size="12">allocated_qty : int (chk &gt; 0)</text>
    <text x="15" y="185" fill="#64748b" font-size="11">created_at, updated_at</text>
  </g>

  <!-- ================= TABLE: DISTRIBUTIONS ================= -->
  <g transform="translate(840, 830)" filter="url(#shadow)">
    <rect width="360" height="250" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 352 0 Q 360 0 360 8 L 360 38 L 0 38 Z" fill="url(#headerGrad3)"/>
    <text x="15" y="24" fill="#ffffff" font-size="14" font-weight="700">distributions (handover receipts)</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#fbbf24" font-weight="600">PK </tspan>id : uuid</text>
    <text x="15" y="85" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">FK </tspan>allocation_id : uuid [UNIQUE]</text>
    <text x="15" y="110" fill="#f8fafc" font-size="12"><tspan fill="#a78bfa" font-weight="600">FK </tspan>distributed_by_user_id : uuid</text>
    <text x="15" y="135" fill="#f8fafc" font-size="12">distribution_date : timestamptz</text>
    <text x="15" y="160" fill="#f8fafc" font-size="12">received_by : varchar(150)</text>
    <text x="15" y="185" fill="#94a3b8" font-size="12">receiver_contact : varchar(50)</text>
    <text x="15" y="210" fill="#64748b" font-size="11">notes, created_at, updated_at</text>
  </g>
</svg>