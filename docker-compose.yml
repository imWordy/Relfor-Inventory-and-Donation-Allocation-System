version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: relfor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-relfor_db}
      POSTGRES_USER: ${DB_USER:-relfor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-relfor_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-relfor_user} -d ${DB_NAME:-relfor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: relfor_postgres_data
