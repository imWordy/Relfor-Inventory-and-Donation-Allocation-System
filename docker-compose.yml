version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: relfor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-relfor_db}
      POSTGRES_USER: ${DB_USER:-relfor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-relfor_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-relfor_user} -d ${DB_NAME:-relfor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - relfor-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relfor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Relfor Inventory & Donation Allocation API"
      DATABASE_URL: "postgresql+psycopg://${DB_USER:-relfor_user}:${DB_PASSWORD:-relfor_password}@postgres:5432/${DB_NAME:-relfor_db}"
      SECRET_KEY: ${SECRET_KEY:-production_secret_key_change_me}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
    ports:
      - "8000:8000"
    networks:
      - relfor-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relfor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - relfor-net

volumes:
  postgres_data:
    name: relfor_postgres_data

networks:
  relfor-net:
    driver: bridge
